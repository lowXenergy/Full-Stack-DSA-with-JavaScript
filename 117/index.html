<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Big Virtual Piano</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Virtual Piano</h1>

    <div class="piano">

      <!-- OCTAVE 1 -->
      <div class="key white">A</div>
      <div class="key black black1">W</div>

      <div class="key white">S</div>
      <div class="key black black2">E</div>

      <div class="key white">D</div>

      <div class="key white">F</div>
      <div class="key black black3">T</div>

      <div class="key white">G</div>
      <div class="key black black4">Y</div>

      <div class="key white">H</div>
      <div class="key black black5">U</div>

      <div class="key white">J</div>

      <!-- OCTAVE 2 -->
      <div class="key white">K</div>
      <div class="key black black6">O</div>

      <div class="key white">L</div>
      <div class="key black black7">P</div>

      <div class="key white">;</div>

      <div class="key white">Z</div>
      <div class="key black black8">X</div>

      <div class="key white">C</div>
      <div class="key black black9">V</div>

      <div class="key white">B</div>
      <div class="key black black10">N</div>

      <div class="key white">M</div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
